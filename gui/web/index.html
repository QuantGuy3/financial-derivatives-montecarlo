<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte Carlo Studio</title>
<meta name="description" content="Valoración de derivados con Monte Carlo en CPU multihilo y GPU: convergencia y trayectorias animadas.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="/vendor/echarts.min.js"></script>
<script type="module" src="/assets/app.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#1baf7a"/></linearGradient></defs>
      <rect width="32" height="32" rx="9" fill="url(#lg)"/>
      <path d="M5 21 C9 21 10 10 14 12 S19 23 22 15 S25 9 27 8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M5 24 C10 20 12 17 16 17 S22 12 27 14" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <div><h1>Monte Carlo Studio</h1><small data-i18n="app.sub"></small></div>
  </div>
  <span class="spacer"></span>
  <span class="chip hide-sm" id="chip-backend"><span class="dot"></span><span id="chip-backend-text"></span></span>
  <span class="chip hide-sm" id="chip-threads"></span>
  <button class="icon-btn lang-btn" id="btn-lang" title="Idioma / Language">ES</button>
  <button class="icon-btn" id="btn-theme" data-i18n-title="topbar.theme" title="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="icon-btn" id="btn-quit" data-i18n-title="topbar.quit" title="">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">

    <section class="card" id="card-scenario">
      <div class="card-head"><span class="num-badge">1</span><h2 data-i18n="card.scenario"></h2></div>
      <div class="card-body">
        <div>
          <label class="lbl" for="sel-preset" data-i18n="lbl.preset"></label>
          <select id="sel-preset"></select>
        </div>
        <div>
          <label class="lbl" data-i18n="lbl.model"></label>
          <div class="seg" id="seg-model"></div>
        </div>
        <div id="model-params" style="display:flex;flex-direction:column;gap:10px"></div>
        <div>
          <label class="lbl" for="sel-payoff" data-i18n="lbl.payoff"></label>
          <select id="sel-payoff"></select>
        </div>
        <div id="payoff-params" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>
    </section>

    <section class="card" id="card-method">
      <div class="card-head"><span class="num-badge">2</span><h2 data-i18n="card.method"></h2></div>
      <div class="card-body">
        <div>
          <label class="lbl" data-i18n="lbl.family"></label>
          <div class="seg" id="seg-family"></div>
          <div class="hint" id="family-hint" style="margin-top:6px"></div>
        </div>
        <div id="wrap-noise">
          <label class="lbl" data-i18n="lbl.noise"></label>
          <div class="seg" id="seg-noise"></div>
        </div>
        <div>
          <label class="lbl" data-i18n="lbl.variance"></label>
          <div class="seg" id="seg-variance"></div>
        </div>
        <div class="warn-box" id="method-warn" hidden></div>
        <details class="adv">
          <summary data-i18n="adv.title"></summary>
          <div class="adv-body" id="adv-body"></div>
        </details>
      </div>
    </section>

    <section class="card" id="card-run">
      <div class="card-head"><span class="num-badge">3</span><h2 data-i18n="card.run"></h2></div>
      <div class="card-body">
        <div class="field" id="field-eps"></div>
        <div>
          <label class="lbl" data-i18n="lbl.backend"></label>
          <div class="seg" id="seg-backend"></div>
        </div>
        <div class="field" id="field-threads"></div>
        <div class="field" style="grid-template-columns:1fr 1fr">
          <div>
            <label class="lbl" for="in-seed" data-i18n="lbl.seed"></label>
            <div style="display:flex;gap:6px"><input type="number" id="in-seed" min="0" step="1" value="123"><button class="icon-btn" id="btn-dice" data-i18n-title="lbl.newseed" title="" style="border-color:var(--border-strong)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/><circle cx="12" cy="12" r="1"/></svg></button></div>
          </div>
          <div>
            <label class="lbl" for="sel-maxsec" data-i18n="lbl.maxsec"></label>
            <select id="sel-maxsec"></select>
          </div>
        </div>
        <div class="run-row">
          <button class="btn primary" id="btn-run"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg><span data-i18n="btn.run"></span></button>
          <button class="btn danger" id="btn-cancel" disabled><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span data-i18n="btn.cancel"></span></button>
        </div>
      </div>
    </section>

  </aside>

  <main class="main">

    <section class="stats" id="stats">
      <div class="card stat hero"><div class="k" data-i18n="stat.price"></div><div class="v" id="st-price">—</div><div class="s" id="st-price-s"></div></div>
      <div class="card stat"><div class="k" data-i18n="stat.se"></div><div class="v" id="st-se">—</div><div class="s" id="st-se-s"></div></div>
      <div class="card stat"><div class="k" data-i18n="stat.n"></div><div class="v" id="st-n">—</div><div class="s" id="st-n-s"></div></div>
      <div class="card stat"><div class="k" data-i18n="stat.time"></div><div class="v" id="st-time">—</div><div class="s" id="st-time-s"></div></div>
      <div class="card stat"><div class="k" data-i18n="stat.ref"></div><div class="v" id="st-ref">—</div><div class="s" id="st-ref-s"></div></div>
    </section>

    <section class="card">
      <div class="statusline"><span id="status-text"></span><div class="progress" aria-hidden="true"><i id="progress-bar"></i></div><span class="num" id="status-pct"></span></div>
      <div class="tabs" role="tablist">
        <button class="on" data-tab="conv" role="tab" data-i18n="tab.conv"></button>
        <button data-tab="paths" role="tab" data-i18n="tab.paths"></button>
        <button data-tab="results" role="tab" data-i18n="tab.results"></button>
      </div>

      <!-- Convergencia -->
      <div class="tab-panel on" id="panel-conv">
        <div class="chart-grid">
          <div class="chart-card"><h3 data-i18n="chart.price"></h3><div class="chart" id="chart-price"></div><div class="chart-empty" id="empty-price"></div></div>
          <div class="chart-card"><h3 data-i18n="chart.error"></h3><div class="chart" id="chart-error"></div><div class="chart-empty" id="empty-error"></div></div>
        </div>
        <div id="conv-extra" style="margin-top:14px"></div>
      </div>

      <!-- Trayectorias -->
      <div class="tab-panel" id="panel-paths">
        <div class="toolbar">
          <div class="group"><label for="rg-npaths" data-i18n="paths.n"></label><input type="range" id="rg-npaths" min="1" max="200" value="5"><input type="number" id="in-npaths" min="1" max="200" value="5"></div>
          <div class="group"><label for="sel-steps" data-i18n="paths.steps"></label><select id="sel-steps"></select></div>
          <div class="group"><label data-i18n="paths.source"></label><div class="seg" id="seg-source"></div></div>
          <div class="group" id="grp-construction"><label data-i18n="paths.construction"></label><div class="seg" id="seg-construction"></div></div>
        </div>
        <div class="toolbar">
          <button class="btn sm" id="btn-redraw"><span data-i18n="paths.redraw"></span></button>
          <button class="btn sm" id="btn-play"></button>
          <div class="group"><label for="rg-speed" data-i18n="paths.speed"></label><input type="range" id="rg-speed" min="-2" max="2" step="0.25" value="0"><span class="num muted" id="speed-label">1×</span></div>
          <label class="toggle"><input type="checkbox" id="chk-fan"> <span data-i18n="paths.fan"></span></label>
          <label class="toggle"><input type="checkbox" id="chk-mean" checked> <span data-i18n="paths.mean"></span></label>
          <label class="toggle"><input type="checkbox" id="chk-run"> <span data-i18n="paths.run"></span></label>
          <label class="toggle" id="tgl-coupled"><input type="checkbox" id="chk-coupled"> <span data-i18n="paths.coupled"></span></label>
        </div>
        <div class="path-layout">
          <div>
            <div class="chart-card"><h3 id="paths-title"></h3><div class="chart tall" id="chart-paths"></div></div>
            <div class="chart-card" id="card-var" style="margin-top:12px" hidden><h3 data-i18n="paths.variance"></h3><div class="chart short" id="chart-var"></div></div>
          </div>
          <div class="chart-card"><h3 data-i18n="paths.terminal"></h3><div class="chart tall" id="chart-hist"></div><div class="chart-empty" id="empty-hist"></div></div>
        </div>
        <div class="hint" id="paths-note" style="margin-top:10px"></div>
      </div>

      <!-- Resultados -->
      <div class="tab-panel" id="panel-results">
        <div class="toolbar">
          <button class="btn sm" id="btn-copy-md" data-i18n="res.copymd"></button>
          <button class="btn sm" id="btn-copy-csv" data-i18n="res.copycsv"></button>
          <button class="btn sm" id="btn-dl-csv" data-i18n="res.dlcsv"></button>
          <span class="spacer"></span>
          <button class="btn sm danger" id="btn-clear" data-i18n="res.clear"></button>
        </div>
        <div class="table-wrap"><table class="results" id="tbl-results"></table></div>
        <div class="empty-note" id="res-empty"></div>
      </div>
    </section>

  </main>
</div>

<div class="toast-host" id="toasts"></div>
</body>
</html>
